# Config for the CI eval run. Same agent settings as config/default.yaml - a
# gate that ran a different model or a different max_steps would not be a gate -
# with the vector store swapped to the JSON index so the workflow needs no
# database service.

agent:
  model: claude-opus-5
  max_tokens: 8000
  effort: high
  max_steps: 8
  structured_retries: 1
  mode: agent

retrieval:
  k: 6
  chunk_tokens: 320
  chunk_overlap: 60
  embedder: hashing
  embedding_dim: 512
  store: memory
  corpus_dir: corpus

ingest:
  log_tail_lines: 400
  history_runs: 10

security:
  max_untrusted_chars: 20000
  max_field_chars: 4000
  max_tool_result_chars: 12000
