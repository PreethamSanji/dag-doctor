[project]
name = "dag-doctor"
version = "0.2.0"
description = "AI incident-triage copilot for Apache Airflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.scripts]
triage = "triage.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "llm: tests that call a hosted LLM (excluded from `make check`)",
    "integration: replayed transcripts, no network",
    "pgvector: needs a reachable DATABASE_URL (docker compose up -d db)",
]
